[project]
name = "commons"
version = "0.0.0"
description = "Agent Commons: a shared, outcome-ranked knowledge store for coding agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[project.scripts]
commons = "commons.cli.main:main"
commons-mcp = "commons.mcp.server:main"
