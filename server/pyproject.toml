[project]
name = "commons"
version = "0.0.0"
description = "Agent Commons: a shared, outcome-ranked knowledge store for coding agents."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[project.scripts]
commons = "commons.cli.main:main"
