# Hosted Agent Commons for a group (decision 0018). Run from the repo root:
#   docker compose -f db/compose.hosted.yml --env-file db/.env up -d --build
# db/.env (gitignored) must set DOMAIN and COMMONS_DB_PASSWORD. See INSTALL.md, "Hosting".
name: agent-commons-hosted

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: ${COMMONS_DB_PASSWORD:?set COMMONS_DB_PASSWORD}
      POSTGRES_DB: commons
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons -d commons"]
      interval: 2s
      timeout: 3s
      retries: 15

  # MCP, hook API, and admin dashboard in one process (decision 0019); migrates on start.
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: agent-commons-server
    restart: unless-stopped
    environment:
      COMMONS_DATABASE_URL: postgresql://commons:${COMMONS_DB_PASSWORD:?set COMMONS_DB_PASSWORD}@postgres:5432/commons
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
