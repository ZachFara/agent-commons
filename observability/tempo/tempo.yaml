# Tempo 3, monolithic on the local filesystem (decision 0037). Not for production.
# 3.x has no `ingester` or `compactor` blocks (the live-store and block-builder replaced them);
# retention is a per-tenant override.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # Since 2.7 the receivers bind to localhost unless told otherwise; Alloy is another
        # container, so bind to every interface of this one.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Service graphs and span metrics (traces_spanmetrics_*, traces_service_graph_*) go to Mimir;
# Grafana's Tempo data source draws the service map from them.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
