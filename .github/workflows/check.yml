name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: commons
          POSTGRES_PASSWORD: commons
          POSTGRES_DB: commons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commons -d commons"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      COMMONS_TEST_DATABASE_URL: postgresql://commons:commons@localhost:5432/commons
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python tools/check.py
