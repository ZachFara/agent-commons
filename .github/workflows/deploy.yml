name: deploy

# Every merge to main: build one image, deploy it to staging, smoke-test it, then wait for
# approval on the "production" environment and promote the same image (decision 0022).
# Skipped until the repository variables from `terraform output github_variables` exist.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent-commons/server:${{ github.sha }}

jobs:
  build:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -f server/Dockerfile -t "$IMAGE" .
      - run: docker push "$IMAGE"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        run: |
          gcloud run deploy agent-commons-staging --image "$IMAGE" --region "$REGION" --quiet
          echo "url=$(gcloud run services describe agent-commons-staging --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: test "$(curl -fsS --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/health")" = ok

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production # requires approval (see infra/README.md)
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        run: |
          gcloud run deploy agent-commons --image "$IMAGE" --region "$REGION" --quiet
          echo "url=$(gcloud run services describe agent-commons --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: test "$(curl -fsS --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/health")" = ok
