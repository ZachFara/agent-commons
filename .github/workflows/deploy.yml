name: deploy

# Builds the server image and deploys it to Cloud Run (infra/README.md).
# Runs only once the repository variables from `terraform output github_variables` are set.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent-commons/server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build -f server/Dockerfile -t "$IMAGE" .
      - run: docker push "$IMAGE"
      - run: >-
          gcloud run deploy agent-commons
          --image "$IMAGE"
          --region "${{ vars.GCP_REGION }}"
          --quiet
      - name: Smoke test
        run: |
          url=$(gcloud run services describe agent-commons --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          test "$(curl -fsS "$url/healthz")" = ok
