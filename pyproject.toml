# Workspace root: holds dev tooling and check configuration only.
# The installable package lives in server/ (see docs/decisions/0002).
[project]
name = "agent-commons-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "commons",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "vulture>=2.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
commons = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server/src", "server/tests", "tools"]
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "D100",   # module docstrings are optional; package docstrings are not
    "D104",
    "CPY001", # no per-file copyright headers; licensing is repo-level
]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101", "D", "PLR2004"]
"tools/**" = ["S603", "S607", "T201"]
# MCP tool signatures are the external API schema; flat parameters per DESIGN.md (decision 0011).
"server/src/commons/mcp/**" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 4
max-statements = 40
max-nested-blocks = 3

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "server/src"
files = ["server/src", "server/tests", "tools"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]

# ---------------------------------------------------------------- vulture
[tool.vulture]
paths = ["server/src", "tools"]
min_confidence = 60

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

# ---------------------------------------------------------------- import-linter
# Enforces the module boundaries from DESIGN.md §2-§4. See docs/decisions/0003.
[tool.importlinter]
root_package = "commons"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: entrypoints > service > components > domain"
type = "layers"
layers = [
    "commons.mcp | commons.cli | commons.web",
    "commons.service",
    "commons.store | commons.ranking | commons.privacy | commons.adapters",
    "commons.domain",
]

[[tool.importlinter.contracts]]
name = "Pure layers never touch I/O libraries"
type = "forbidden"
source_modules = ["commons.domain", "commons.ranking", "commons.privacy", "commons.adapters"]
forbidden_modules = ["psycopg", "fastmcp", "httpx", "httpx2", "subprocess", "socket"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the mcp layer imports FastMCP"
type = "forbidden"
source_modules = ["commons.domain", "commons.ranking", "commons.privacy", "commons.adapters", "commons.store", "commons.service", "commons.cli", "commons.web"]
forbidden_modules = ["fastmcp"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the store layer imports the database driver"
type = "forbidden"
source_modules = ["commons.domain", "commons.ranking", "commons.privacy", "commons.adapters", "commons.service", "commons.mcp", "commons.cli", "commons.web"]
forbidden_modules = ["psycopg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the web layer imports the web stack"
type = "forbidden"
source_modules = ["commons.domain", "commons.ranking", "commons.privacy", "commons.adapters", "commons.store", "commons.service", "commons.mcp", "commons.cli"]
forbidden_modules = ["starlette", "uvicorn", "jinja2"]
allow_indirect_imports = true
